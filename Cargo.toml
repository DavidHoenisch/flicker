[package]
name = "flicker"
version = "0.4.2"
edition = "2024"

[dependencies]
# The Async Runtime (Go's scheduler equivalent)
tokio = { version = "1", features = ["full"] }

# Serialization (JSON/YAML parsing)
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"

# Error handling (Clean error propagation)
anyhow = "1.0"

# Async Traits (Rust traits normally can't be async, this macro fixes that)
async-trait = "0.1"

# HTTP Client (For HTTP/Elasticsearch destinations)
# Use native-tls for mTLS client certificate support (provides Identity::from_pem())
reqwest = { version = "0.11", features = ["json", "native-tls"], default-features = false }

# OpenSSL (needed for reqwest native-tls)
# Use vendored feature for cross-compilation compatibility
openssl = { version = "0.10", features = ["vendored"] }

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Date/time handling (For Elasticsearch timestamps)
chrono = { version = "0.4", features = ["serde"] }

# System hostname (For Syslog)
hostname = "0.4"

# Regular expressions (For log filtering)
regex = "1"

# Base64 encoding (For basic auth)
base64 = "0.22"

# Docker API client (For Docker container log capture)
bollard = "0.17"

# Async utilities (For Docker log streaming)
futures-util = "0.3"

# Gzip compression (For HTTP payload compression)
flate2 = "1.0"

# AWS S3 SDK (For S3 registry storage)
aws-sdk-s3 = "1"
aws-config = "1"

[dev-dependencies]
# Temporary files for testing
tempfile = "3"

[profile.release]
opt-level = 's' # Optimize for size
lto = true      # Link-Time Optimization
codegen-units = 1 # Minimize parallel compilation units
strip = true    # Strip debug symbols

