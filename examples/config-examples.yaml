# Flicker Configuration Examples
# Demonstrates all supported destination types

log_files:
  # Example 1: HTTP Destination (Vector, custom HTTP endpoints)
  - path: "/var/log/myapp/app.log"
    polling_frequency_ms: 250
    buffer_size: 100
    flush_interval_ms: 30000
    destination:
      type: "http"
      endpoint: "http://vector:8080/ingest"
      api_key: "optional_api_key_here"  # Optional

  # Example 2: Syslog Destination via UDP (rsyslog, syslog-ng)
  - path: "/var/log/myapp/syslog.log"
    polling_frequency_ms: 500
    buffer_size: 50
    flush_interval_ms: 15000
    destination:
      type: "syslog"
      host: "syslog-server.local"
      port: 514          # Default: 514
      protocol: "udp"    # "udp" or "tcp", default: "udp"

  # Example 3: Syslog Destination via TCP
  - path: "/var/log/myapp/audit.log"
    polling_frequency_ms: 1000
    buffer_size: 25
    flush_interval_ms: 60000
    destination:
      type: "syslog"
      host: "10.0.1.50"
      port: 1514
      protocol: "tcp"

  # Example 4: Elasticsearch Destination
  - path: "/var/log/myapp/errors.log"
    polling_frequency_ms: 500
    buffer_size: 100
    flush_interval_ms: 30000
    destination:
      type: "elasticsearch"
      url: "http://elasticsearch:9200"
      index: "logs-myapp"

  # Example 5: File Destination (JSONL output)
  # Useful for debugging, backup, or format conversion
  - path: "/var/log/myapp/debug.log"
    polling_frequency_ms: 1000
    buffer_size: 50
    flush_interval_ms: 45000
    destination:
      type: "file"
      path: "/backup/logs/debug.jsonl"

  # Example 6: Multiple files to same Elasticsearch cluster, different indices
  - path: "/var/log/nginx/access.log"
    polling_frequency_ms: 250
    buffer_size: 200
    flush_interval_ms: 10000
    destination:
      type: "elasticsearch"
      url: "http://elasticsearch:9200"
      index: "logs-nginx-access"

  - path: "/var/log/nginx/error.log"
    polling_frequency_ms: 500
    buffer_size: 50
    flush_interval_ms: 20000
    destination:
       type: "elasticsearch"
       url: "http://elasticsearch:9200"
       index: "logs-nginx-error"

  # Example 7: Basic S3 Destination
  - path: "/var/log/myapp/s3.log"
    polling_frequency_ms: 1000
    buffer_size: 100
    flush_interval_ms: 60000
    destination:
       type: "s3"
       bucket: "my-log-bucket"
       prefix: "logs/myapp/"  # Optional: S3 key prefix
       region: "us-west-2"    # Optional: AWS region
       # AWS credentials are loaded from environment variables (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY)

  # Example 8: Advanced S3 Destination for Long-term Archival
  - path: "/var/log/myapp/archive.log"
    polling_frequency_ms: 2000
    buffer_size: 500  # Larger buffer for batching
    flush_interval_ms: 300000  # 5 minutes for archival
    destination:
       type: "s3"
       bucket: "archive-bucket"
       prefix: "year=2023/month=12/day=01/"  # Structured prefix for partitioning
       region: "us-east-1"
       # For S3-compatible services (MinIO, etc.), set AWS_ENDPOINT_URL environment variable
